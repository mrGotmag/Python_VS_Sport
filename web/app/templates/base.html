<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Python vs Спорт{% endblock %}</title>

    {% block head %}{% endblock %}

    <style>
    /* ====== ЛОКАЛЬНЫЕ ШРИФТЫ ====== */
    @font-face {
        font-family: 'Russo One';
        src: url('/static/vendor/fonts/russo-one/RussoOne-Regular.woff2') format('woff2'),
             url('/static/vendor/fonts/russo-one/RussoOne-Regular.woff') format('woff');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
    }

    @font-face {
        font-family: 'JetBrains Mono';
        src: url('/static/vendor/fonts/jetbrains-mono/JetBrainsMono-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
    }
    @font-face {
        font-family: 'JetBrains Mono';
        src: url('/static/vendor/fonts/jetbrains-mono/JetBrainsMono-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
    }
    @font-face {
        font-family: 'JetBrains Mono';
        src: url('/static/vendor/fonts/jetbrains-mono/JetBrainsMono-Italic.woff2') format('woff2');
        font-weight: 400;
        font-style: italic;
        font-display: swap;
    }
    /* ============================== */
        :root{
            --bg-0:#05070a;
            --bg-1:#0a0f14;
            --bg-2:#0f1620;
            --bg-3:#141c28;
            --line:#1e2a3a;
            --line-2:#2a3a4f;
            --text:#d6e1ef;
            --muted:#6b7d93;
            --accent:#00ff9c;
            --accent-2:#00e5ff;
            --amber:#ffb347;
            --danger:#ff3b6b;
            --violet:#b388ff;
            --glow: 0 0 20px rgba(0,255,156,.35);
            --glow-2: 0 0 30px rgba(0,229,255,.25);
        }

        *{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%}
        body{
            font-family:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
            background:var(--bg-0);
            color:var(--text);
            overflow-x:hidden;
            min-height:100vh;
            position:relative;
            letter-spacing:.2px;
            -webkit-font-smoothing:antialiased;
        }

        /* ====== МАТРИЧНЫЙ ФОН ====== */
        .matrix-bg{
            position:fixed;inset:0;z-index:0;pointer-events:none;
            background:
                radial-gradient(ellipse at 20% 10%, rgba(0,255,156,.08), transparent 50%),
                radial-gradient(ellipse at 80% 90%, rgba(0,229,255,.08), transparent 50%),
                linear-gradient(180deg, #05070a 0%, #0a0f14 100%);
        }
        .matrix-bg::before{
            content:"";position:absolute;inset:0;
            background-image:
                linear-gradient(rgba(0,255,156,.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,156,.04) 1px, transparent 1px);
            background-size:40px 40px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
        }
        .matrix-bg::after{
            content:"";position:absolute;inset:0;
            background:repeating-linear-gradient(
                0deg,
                rgba(255,255,255,.015) 0px,
                rgba(255,255,255,.015) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events:none;
            animation: scan 8s linear infinite;
        }
        @keyframes scan{
            0%{background-position:0 0}
            100%{background-position:0 100px}
        }

        /* ====== LAYOUT ====== */
        .shell{
            position:relative;z-index:2;
            min-height:100vh;
            display:flex;flex-direction:column;
        }

        /* ====== HEADER ====== */
        .topbar{
            position:sticky;top:0;z-index:50;
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            background:linear-gradient(180deg, rgba(5,7,10,.85), rgba(5,7,10,.55));
            border-bottom:1px solid var(--line);
        }
        .topbar-inner{
            max-width:1400px;margin:0 auto;
            padding:14px 28px;
            display:flex;align-items:center;justify-content:space-between;
            gap:24px;
        }
        .brand{
            display:flex;align-items:center;gap:14px;
            text-decoration:none;color:var(--text);
        }
        .brand-mark{
            width:42px;height:42px;border-radius:10px;
            background:
                linear-gradient(135deg, rgba(0,255,156,.15), rgba(0,229,255,.15)),
                #0a0f14;
            border:1px solid var(--line-2);
            display:grid;place-items:center;
            position:relative;
            box-shadow: inset 0 0 20px rgba(0,255,156,.08), var(--glow);
        }
        .brand-mark::before{
            content:"λ";
            font-family:'Russo One',sans-serif;
            font-weight:900;font-size:22px;
            color:var(--accent);
            text-shadow:0 0 12px var(--accent);
        }
        .brand-mark::after{
            content:"";position:absolute;inset:-1px;border-radius:10px;
            background:conic-gradient(from 0deg, transparent 0 70%, var(--accent) 80%, transparent 100%);
            opacity:.6;filter:blur(6px);z-index:-1;
            animation: spin 6s linear infinite;
        }
        @keyframes spin{to{transform:rotate(360deg)}}

        .brand-text{display:flex;flex-direction:column;line-height:1.05}
        .brand-text b{
            font-family:'Russo One',sans-serif;
            font-weight:900;font-size:15px;letter-spacing:2px;
            background:linear-gradient(90deg,#fff,#00ff9c 60%,#00e5ff);
            -webkit-background-clip:text;background-clip:text;color:transparent;
        }
        .brand-text span{
            font-size:10px;color:var(--muted);letter-spacing:3px;margin-top:4px;
        }

        .nav{display:flex;align-items:center;gap:10px}
        .nav a{
            position:relative;
            padding:8px 14px;
            font-size:12px;letter-spacing:2px;
            color:var(--muted);text-decoration:none;
            border:1px solid transparent;border-radius:8px;
            transition:.25s;
            text-transform:uppercase;
        }
        .nav a:hover{
            color:var(--accent);
            border-color:var(--line-2);
            background:rgba(0,255,156,.05);
            box-shadow:var(--glow);
        }
        .nav a.active{color:var(--accent);border-color:var(--line-2)}

        .status{
            display:flex;align-items:center;gap:8px;
            font-size:10px;letter-spacing:3px;color:var(--muted);
            padding:6px 12px;border:1px solid var(--line);border-radius:999px;
            background:rgba(0,255,156,.04);
        }
        .status .dot{
            width:8px;height:8px;border-radius:50%;
            background:var(--accent);
            box-shadow:0 0 10px var(--accent);
            animation:pulse 1.6s ease-in-out infinite;
        }
        @keyframes pulse{
            0%,100%{opacity:1;transform:scale(1)}
            50%{opacity:.4;transform:scale(.85)}
        }

        /* ====== CONTENT ====== */
        main{
            flex:1;
            max-width:1400px;width:100%;margin:0 auto;
            padding:36px 28px 60px;
        }

        /* ====== FOOTER ====== */
        .foot{
            border-top:1px solid var(--line);
            padding:18px 28px;
            display:flex;justify-content:space-between;align-items:center;
            font-size:10px;letter-spacing:3px;color:var(--muted);
            background:rgba(5,7,10,.6);
            backdrop-filter:blur(8px);
        }
        .foot .cursor{
            display:inline-block;width:8px;height:14px;background:var(--accent);
            margin-left:4px;vertical-align:middle;
            animation: blink 1s steps(2) infinite;
            box-shadow:0 0 8px var(--accent);
        }
        @keyframes blink{50%{opacity:0}}

        /* ====== ОБЩИЕ КОМПОНЕНТЫ ====== */
        .panel{
            position:relative;
            background:linear-gradient(180deg, rgba(15,22,32,.7), rgba(10,15,20,.7));
            border:1px solid var(--line);
            border-radius:14px;
            backdrop-filter: blur(10px);
            overflow:hidden;
        }
        .panel::before{
            content:"";position:absolute;inset:0;pointer-events:none;
            background:
                linear-gradient(180deg, rgba(0,255,156,.06), transparent 30%),
                radial-gradient(600px 200px at 100% 0%, rgba(0,229,255,.08), transparent 60%);
        }
        .panel-head{
            padding:14px 18px;
            display:flex;align-items:center;justify-content:space-between;
            border-bottom:1px solid var(--line);
            background:linear-gradient(90deg, rgba(0,255,156,.05), transparent);
        }
        .panel-head .tag{
            font-size:10px;letter-spacing:3px;color:var(--accent);
            display:flex;align-items:center;gap:8px;
        }
        .panel-head .tag::before{
            content:"";width:6px;height:6px;border-radius:50%;
            background:var(--accent);box-shadow:0 0 8px var(--accent);
        }
        .panel-body{padding:22px}

        /* Кнопки */
        .btn{
            --c:var(--accent);
            display:inline-flex;align-items:center;gap:10px;
            padding:12px 22px;
            font-family:inherit;font-size:12px;letter-spacing:3px;
            text-transform:uppercase;font-weight:600;
            color:var(--bg-0);background:var(--c);
            border:1px solid var(--c);border-radius:10px;
            cursor:pointer;text-decoration:none;
            transition:.25s;
            position:relative;overflow:hidden;
        }
        .btn::before{
            content:"";position:absolute;inset:0;
            background:linear-gradient(120deg, transparent 30%, rgba(255,255,255,.35), transparent 70%);
            transform:translateX(-100%);transition:.6s;
        }
        .btn:hover::before{transform:translateX(100%)}
        .btn:hover{
            box-shadow:0 0 24px rgba(0,255,156,.5), inset 0 0 20px rgba(255,255,255,.15);
            transform:translateY(-1px);
        }
        .btn.ghost{background:transparent;color:var(--accent)}
        .btn.ghost:hover{background:rgba(0,255,156,.08)}
        .btn.danger{--c:var(--danger);color:#fff}
        .btn.amber{--c:var(--amber)}

        /* Поля ввода */
        .field{display:flex;flex-direction:column;gap:8px}
        .field label{
            font-size:10px;letter-spacing:3px;color:var(--muted);
            text-transform:uppercase;
        }
        .input, .select, textarea{
            font-family:inherit;font-size:14px;
            padding:14px 16px;
            background:rgba(5,7,10,.6);
            border:1px solid var(--line-2);
            border-radius:10px;
            color:var(--text);
            outline:none;
            transition:.25s;
            width:100%;
        }
        .input:focus, .select:focus, textarea:focus{
            border-color:var(--accent);
            box-shadow:0 0 0 3px rgba(0,255,156,.12), var(--glow);
            background:rgba(5,7,10,.9);
        }
        textarea{resize:vertical;min-height:180px;font-size:13px;line-height:1.6}

        /* Таблицы */
        table{width:100%;border-collapse:collapse;font-size:13px}
        thead th{
            text-align:left;
            font-size:10px;letter-spacing:3px;color:var(--muted);
            text-transform:uppercase;
            padding:14px 16px;
            border-bottom:1px solid var(--line-2);
            background:rgba(0,255,156,.03);
        }
        tbody td{padding:16px;border-bottom:1px solid var(--line)}
        tbody tr{transition:.2s}
        tbody tr:hover{background:rgba(0,255,156,.04)}

        /* Бейджи */
        .badge{
            display:inline-flex;align-items:center;gap:6px;
            padding:4px 10px;border-radius:999px;
            font-size:10px;letter-spacing:2px;
            border:1px solid var(--line-2);
            color:var(--muted);
        }
        .badge.ok{color:var(--accent);border-color:rgba(0,255,156,.3);background:rgba(0,255,156,.06)}
        .badge.warn{color:var(--amber);border-color:rgba(255,179,71,.3);background:rgba(255,179,71,.06)}
        .badge.err{color:var(--danger);border-color:rgba(255,59,107,.3);background:rgba(255,59,107,.06)}

        /* Заголовки */
        .h-title{
            font-family:'Russo One',sans-serif;
            font-weight:900;letter-spacing:4px;
            font-size:28px;
            background:linear-gradient(90deg,#fff 0%, var(--accent) 60%, var(--accent-2) 100%);
            -webkit-background-clip:text;background-clip:text;color:transparent;
            text-shadow:0 0 40px rgba(0,255,156,.2);
            margin-bottom:6px;
        }
        .h-sub{
            font-size:11px;letter-spacing:4px;color:var(--muted);
            text-transform:uppercase;
        }
        .h-sub::before{content:"// ";color:var(--accent)}

        /* Глитч */
        .glitch{position:relative;display:inline-block}
        .glitch::before, .glitch::after{
            content:attr(data-text);position:absolute;left:0;top:0;width:100%;
            background:transparent;
        }
        .glitch::before{
            color:var(--accent-2);transform:translate(2px,0);
            mix-blend-mode:screen;opacity:.7;
            animation: glitch1 3s infinite steps(2,end);
            clip-path:polygon(0 0, 100% 0, 100% 45%, 0 45%);
        }
        .glitch::after{
            color:var(--danger);transform:translate(-2px,0);
            mix-blend-mode:screen;opacity:.6;
            animation: glitch2 2.4s infinite steps(2,end);
            clip-path:polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
        }
        @keyframes glitch1{
            0%,92%,100%{transform:translate(0,0)}
            93%{transform:translate(-3px,1px)}
            95%{transform:translate(2px,-1px)}
            97%{transform:translate(-1px,2px)}
        }
        @keyframes glitch2{
            0%,90%,100%{transform:translate(0,0)}
            91%{transform:translate(3px,-1px)}
            94%{transform:translate(-2px,1px)}
            96%{transform:translate(1px,-2px)}
        }

        /* Скроллбар */
        ::-webkit-scrollbar{width:10px;height:10px}
        ::-webkit-scrollbar-track{background:var(--bg-1)}
        ::-webkit-scrollbar-thumb{
            background:linear-gradient(180deg, var(--line-2), var(--line));
            border-radius:10px;border:2px solid var(--bg-1);
        }
        ::-webkit-scrollbar-thumb:hover{background:var(--accent)}

        /* Утилиты */
        .row{display:flex;gap:14px;flex-wrap:wrap}
        .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
        .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
        .mt-2{margin-top:18px}.mt-3{margin-top:28px}
        .mono{font-family:'JetBrains Mono',monospace}
        .accent{color:var(--accent)}
        .muted{color:var(--muted)}
        .divider{height:1px;background:linear-gradient(90deg, transparent, var(--line-2), transparent);margin:22px 0}

        @media (max-width: 860px){
            .grid-2,.grid-3{grid-template-columns:1fr}
            .topbar-inner{padding:12px 16px}
            main{padding:24px 16px 40px}
            .h-title{font-size:22px;letter-spacing:2px}
        }
    </style>
</head>
<body>
    <div class="matrix-bg"></div>

    <div class="shell">
        <header class="topbar">
            <div class="topbar-inner">
                <a class="brand" href="/">
                    <div class="brand-mark"></div>
                    <div class="brand-text">
                        <b>PYTHON&nbsp;//&nbsp;СПОРТ</b>
                        <span>МИВЛГУ · CONTEST_SYS</span>
                    </div>
                </a>
                <nav class="nav">
                    <a href="/staff">Staff</a>
                </nav>
                <div class="status">
                    <span class="dot"></span>ONLINE
                </div>
            </div>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>

        <footer class="foot">
            <div>&gt; строим решения вместе _ {2026} _ mivlgu.sys</div>
            <div>BUILD 1.0.0 <span class="cursor"></span></div>
        </footer>
    </div>
</body>
</html>
