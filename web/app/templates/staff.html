{% extends "base.html" %}
{% block title %}Панель судьи // Python vs Спорт{% endblock %}

{% block head %}
<style>
    /* ====== LAYOUT ====== */
    .judge-wrap {
        max-width: 1200px;
        margin: 0 auto;
        padding: 16px;
        position: relative;
        z-index: 3;
        animation: fadeIn 0.6s ease-out;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ====== ЗАГОЛОВОК ====== */
    .judge-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 12px;
    }
    .judge-title {
        font-family: 'Russo One', sans-serif;
        font-size: 24px;
        letter-spacing: 2px;
        background: linear-gradient(90deg, #fff, var(--accent-2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    /* ====== ПАНЕЛЬ УПРАВЛЕНИЯ ====== */
    .control-panel {
        background: linear-gradient(135deg, rgba(20,28,40,.9), rgba(10,15,20,.95));
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px 20px;
        margin-bottom: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        backdrop-filter: blur(10px);
    }
    .control-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
        flex: 1;
        min-width: 200px;
    }
    .control-label {
        font-size: 10px;
        letter-spacing: 2px;
        color: var(--muted);
        text-transform: uppercase;
        font-weight: 600;
    }
    .control-select {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        padding: 10px 14px;
        background: rgba(5,7,10,.8);
        border: 1px solid var(--line-2);
        border-radius: 8px;
        color: var(--text);
        outline: none;
        transition: .25s;
        cursor: pointer;
    }
    .control-select:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(0,255,156,.15);
    }

    /* Переключатель направления */
    .direction-toggle {
        display: flex;
        background: rgba(5,7,10,.8);
        border: 1px solid var(--line-2);
        border-radius: 8px;
        padding: 4px;
        gap: 4px;
    }
    .dir-btn {
        flex: 1;
        padding: 8px 12px;
        font-size: 11px;
        letter-spacing: 1px;
        color: var(--muted);
        background: transparent;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: .25s;
        font-family: inherit;
        font-weight: 600;
        text-align: center;
    }
    .dir-btn.active {
        background: rgba(0,255,156,.15);
        color: var(--accent);
        box-shadow: 0 0 10px rgba(0,255,156,.2);
    }
    .dir-btn.active.less {
        background: rgba(255,179,71,.15);
        color: var(--amber);
        box-shadow: 0 0 10px rgba(255,179,71,.2);
    }

    /* ====== СПИСОК УЧАСТНИКОВ (СЕТКА КАРТОЧЕК) ====== */
    .participants-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 16px;
    }
    @media (max-width: 400px) {
        .participants-grid { grid-template-columns: 1fr; }
    }

    .participant-card {
        background: linear-gradient(135deg, rgba(20,28,40,.8), rgba(10,15,20,.9));
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        transition: .3s;
        position: relative;
        overflow: hidden;
    }
    .participant-card:hover {
        border-color: var(--accent-2);
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .participant-card.saved {
        border-color: var(--accent);
        box-shadow: 0 0 15px rgba(0,255,156,.2);
    }

    .p-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 12px;
    }
    .p-name {
        font-family: 'Russo One', sans-serif;
        font-size: 15px;
        color: var(--text);
        margin-bottom: 4px;
    }
    .p-team {
        font-size: 11px;
        color: var(--muted);
        letter-spacing: 1px;
    }
    .p-current-score {
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        font-weight: 700;
        color: var(--accent-2);
        text-shadow: 0 0 10px rgba(0,229,255,.4);
    }
    .p-current-score.empty {
        color: var(--muted);
        font-size: 14px;
        text-shadow: none;
    }

    /* Поле ввода результата */
    .result-input-wrap {
        display: flex;
        gap: 8px;
        margin-top: 12px;
    }
    .result-input {
        flex: 1;
        font-family: 'JetBrains Mono', monospace;
        font-size: 16px;
        font-weight: 700;
        padding: 10px 14px;
        background: rgba(5,7,10,.8);
        border: 1px solid var(--line-2);
        border-radius: 8px;
        color: var(--text);
        outline: none;
        transition: .25s;
        text-align: center;
    }
    .result-input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(0,255,156,.15);
    }
    .result-input::-webkit-inner-spin-button,
    .result-input::-webkit-outer-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    .save-btn {
        width: 44px;
        height: 44px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent), #00d98a);
        border: none;
        color: var(--bg-0);
        font-size: 18px;
        cursor: pointer;
        transition: .25s;
        display: grid;
        place-items: center;
        flex-shrink: 0;
    }
    .save-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 15px rgba(0,255,156,.5);
    }
    .save-btn:active {
        transform: scale(0.95);
    }
    .save-btn.saving {
        background: var(--muted);
        cursor: not-allowed;
    }

    /* ====== TOAST УВЕДОМЛЕНИЕ ====== */
    .judge-toast {
        position: fixed;
        bottom: 24px;
        right: 24px;
        padding: 14px 20px;
        border-radius: 10px;
        background: rgba(10,15,20,.95);
        backdrop-filter: blur(20px);
        border: 1px solid var(--accent);
        color: var(--accent);
        font-size: 12px;
        letter-spacing: 1px;
        font-weight: 600;
        box-shadow: 0 10px 40px rgba(0,0,0,.6), 0 0 20px rgba(0,255,156,.3);
        z-index: 100;
        display: none;
        animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .judge-toast.show { display: flex; align-items: center; gap: 8px; }
    @keyframes slideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ====== ПУСТОЕ СОСТОЯНИЕ ====== */
    .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--muted);
        grid-column: 1 / -1;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; opacity: 0.3; }

    /* Индикатор "синхронизировано" */
    .sync-indicator {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        letter-spacing: 2px;
        color: var(--muted);
        padding: 4px 10px;
        border-radius: 6px;
        background: rgba(5,7,10,.6);
        border: 1px solid var(--line);
        transition: .3s;
    }
    .sync-indicator.syncing {
        color: var(--amber);
        border-color: rgba(255,179,71,.3);
    }
    .sync-indicator.synced {
        color: var(--accent);
        border-color: rgba(0,255,156,.3);
        background: rgba(0,255,156,.06);
    }
    .sync-indicator .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 6px currentColor;
    }
    .sync-indicator.syncing .dot {
        animation: pulse 1s ease-in-out infinite;
    }
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: .3; }
    }
</style>
{% endblock %}

{% block content %}
<div class="judge-wrap">
    <div class="judge-header">
        <div>
            <div class="h-sub" style="margin-bottom: 4px;">// JUDGE_CONSOLE</div>
            <div class="judge-title">ПАНЕЛЬ СУДЬИ</div>
        </div>
        <a href="/logout" class="btn-sm danger" style="padding: 8px 16px; font-size: 10px;">⏻ ВЫЙТИ</a>
    </div>

    <!-- Панель управления -->
    <div class="control-panel">
        <div class="control-group">
            <div class="control-label">Спортивная дисциплина</div>
            <select class="control-select" id="phase-select">
                <option value="">Загрузка фаз...</option>
            </select>
        </div>

        <div class="control-group" style="flex: 0 0 auto;">
            <div class="control-label">Правило оценки</div>
            <div class="direction-toggle" id="direction-toggle">
                <button class="dir-btn active" data-dir="more" onclick="changeDirection('more')">
                    ↑ БОЛЬШЕ = ЛУЧШЕ
                </button>
                <button class="dir-btn less" data-dir="less" onclick="changeDirection('less')">
                    ↓ МЕНЬШЕ = ЛУЧШЕ
                </button>
            </div>
        </div>

        <div class="sync-indicator synced" id="sync-indicator">
            <span class="dot"></span>
            <span id="sync-text">АКТУАЛЬНО</span>
        </div>
    </div>

    <!-- Список участников -->
    <div class="participants-grid" id="participants-grid">
        <div class="empty-state">
            <div class="icon">⟳</div>
            <div>Загрузка данных...</div>
        </div>
    </div>
</div>

<!-- Toast уведомление -->
<div class="judge-toast" id="judge-toast">
    <span>✓</span>
    <span id="toast-message">Результат сохранён</span>
</div>

<script>
    let state = {
        phases: [],
        participants: [],
        results: {}, // { participant_id: attempts }
        currentPhaseId: null,
        currentDirection: 'more'
    };

    // ====== ИНИЦИАЛИЗАЦИЯ ======
    async function init() {
        await loadData();

        // Автовыбор первой фазы, если есть
        if (state.phases.length > 0 && !state.currentPhaseId) {
            selectPhase(state.phases[0].id);
        }
    }

    // ====== ЗАГРУЗКА ДАННЫХ ======
    async function loadData() {
        const syncIndicator = document.getElementById('sync-indicator');
        const syncText = document.getElementById('sync-text');

        syncIndicator?.classList.remove('synced');
        syncIndicator?.classList.add('syncing');
        if (syncText) syncText.textContent = 'ОБНОВЛЕНИЕ...';

        try {
            const res = await fetch('/api/staff/sport_data');
            if (res.status === 401 || res.status === 403) {
                window.location.href = '/';
                return;
            }
            const data = await res.json();

            state.phases = data.phases || [];
            state.participants = data.participants || [];

            state.results = {};
            (data.results || []).forEach(r => {
                state.results[r.participant_id] = r.attempts;
            });

            renderPhaseSelect();
            if (state.currentPhaseId) {
                const phase = state.phases.find(p => p.id === state.currentPhaseId);
                if (phase) {
                    state.currentDirection = phase.sport_direction || 'more';
                    updateDirectionUI();
                }
                renderParticipants();
            }

            syncIndicator?.classList.remove('syncing');
            syncIndicator?.classList.add('synced');
            if (syncText) syncText.textContent = 'АКТУАЛЬНО';
        } catch (err) {
            console.error(err);
            syncIndicator?.classList.remove('syncing');
            if (syncText) syncText.textContent = 'ОШИБКА';
            document.getElementById('participants-grid').innerHTML = `
                <div class="empty-state">
                    <div class="icon">⚠</div>
                    <div>Ошибка загрузки данных</div>
                </div>
            `;
        }
    }

    // ====== ОТРИСОВКА СЕЛЕКТА ФАЗ ======
    function renderPhaseSelect() {
        const select = document.getElementById('phase-select');
        select.innerHTML = state.phases.map(p =>
            `<option value="${p.id}" ${p.id === state.currentPhaseId ? 'selected' : ''}>
                ${p.sport_name}
            </option>`
        ).join('');

        select.onchange = (e) => selectPhase(parseInt(e.target.value));
    }

    // ====== ВЫБОР ФАЗЫ ======
    function selectPhase(phaseId) {
        state.currentPhaseId = phaseId;
        const phase = state.phases.find(p => p.id === phaseId);
        if (phase) {
            state.currentDirection = phase.sport_direction || 'more';
            updateDirectionUI();
        }
        renderParticipants();
    }

    // ====== ОБНОВЛЕНИЕ UI НАПРАВЛЕНИЯ ======
    function updateDirectionUI() {
        document.querySelectorAll('.dir-btn').forEach(btn => {
            btn.classList.remove('active', 'less');
            if (btn.dataset.dir === state.currentDirection) {
                btn.classList.add('active');
                if (state.currentDirection === 'less') btn.classList.add('less');
            }
        });
    }

    // ====== СМЕНА НАПРАВЛЕНИЯ ======
    async function changeDirection(newDir) {
        if (!state.currentPhaseId || newDir === state.currentDirection) return;

        const btn = document.querySelector(`.dir-btn[data-dir="${newDir}"]`);
        const originalText = btn?.textContent;
        if (btn) {
            btn.textContent = '⟳';
            btn.disabled = true;
        }

        try {
            const res = await fetch(`/api/staff/phase/${state.currentPhaseId}/direction`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ direction: newDir })
            });
            if (res.ok) {
                state.currentDirection = newDir;

                // ⭐ КЛЮЧЕВОЕ ИСПРАВЛЕНИЕ: обновляем направление в state.phases
                const phase = state.phases.find(p => p.id === state.currentPhaseId);
                if (phase) phase.sport_direction = newDir;

                updateDirectionUI();
                showToast('Правило оценки обновлено');
            } else {
                throw new Error('Ошибка сервера');
            }
        } catch (err) {
            console.error(err);
            showToast('Ошибка обновления правила', true);
        } finally {
            if (btn) {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }
    }

    // ====== ОТРИСОВКА УЧАСТНИКОВ ======
    function renderParticipants() {
        const grid = document.getElementById('participants-grid');
        if (state.participants.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <div class="icon">👥</div>
                    <div>Участники не найдены</div>
                </div>
            `;
            return;
        }

        grid.innerHTML = state.participants.map(p => {
            const currentAttempts = state.results[p.id] ?? '';
            const hasScore = currentAttempts !== '';

            return `
                <div class="participant-card" id="card-${p.id}">
                    <div class="p-header">
                        <div>
                            <div class="p-name">${escapeHTML(p.name)}</div>
                            <div class="p-team">${escapeHTML(p.team_name)}</div>
                        </div>
                        <div class="p-current-score ${hasScore ? '' : 'empty'}">
                            ${hasScore ? currentAttempts : '—'}
                        </div>
                    </div>
                    <div class="result-input-wrap">
                        <input
                            type="number"
                            class="result-input"
                            id="input-${p.id}"
                            value="${currentAttempts}"
                            placeholder="0"
                            min="0"
                            onkeydown="if(event.key==='Enter') saveResult(${p.id})"
                        >
                        <button class="save-btn" id="btn-${p.id}" onclick="saveResult(${p.id})" title="Сохранить">
                            💾
                        </button>
                    </div>
                </div>
            `;
        }).join('');
    }

    // ====== СОХРАНЕНИЕ РЕЗУЛЬТАТА ======
    async function saveResult(participantId) {
        const input = document.getElementById(`input-${participantId}`);
        const btn = document.getElementById(`btn-${participantId}`);
        const card = document.getElementById(`card-${participantId}`);
        const attemptsStr = input.value.trim();

        if (attemptsStr === '') {
            input.focus();
            return;
        }

        const attempts = parseInt(attemptsStr);
        if (isNaN(attempts) || attempts < 0) {
            showToast('Введите корректное число', true);
            return;
        }

        // UI состояние загрузки
        btn.classList.add('saving');
        btn.innerHTML = '<span class="loading"></span>'; // Можно добавить CSS спиннер

        try {
            const res = await fetch('/api/staff/sport_result', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    participant_id: participantId,
                    phase_id: state.currentPhaseId,
                    attempts: attempts
                })
            });

            if (res.ok) {
                // Успех
                state.results[participantId] = attempts;

                // Обновляем отображение текущего результата в карточке
                const scoreDisplay = card.querySelector('.p-current-score');
                scoreDisplay.textContent = attempts;
                scoreDisplay.classList.remove('empty');

                // Визуальный фидбек
                card.classList.add('saved');
                setTimeout(() => card.classList.remove('saved'), 1500);

                showToast(`Результат ${pName(participantId)} сохранён`);
            } else {
                throw new Error('Ошибка сервера');
            }
        } catch (err) {
            console.error(err);
            showToast('Ошибка сохранения', true);
        } finally {
            btn.classList.remove('saving');
            btn.innerHTML = '💾';
        }
    }

    // ====== УТИЛИТЫ ======
    function pName(id) {
        const p = state.participants.find(x => x.id === id);
        return p ? p.name : 'Участник';
    }

    function escapeHTML(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    let toastTimeout;
    function showToast(msg, isError = false) {
        const toast = document.getElementById('judge-toast');
        const msgEl = document.getElementById('toast-message');

        msgEl.textContent = msg;
        toast.style.borderColor = isError ? 'var(--danger)' : 'var(--accent)';
        toast.style.color = isError ? 'var(--danger)' : 'var(--accent)';
        toast.style.boxShadow = isError
            ? '0 10px 40px rgba(0,0,0,.6), 0 0 20px rgba(255,59,107,.3)'
            : '0 10px 40px rgba(0,0,0,.6), 0 0 20px rgba(0,255,156,.3)';

        toast.classList.add('show');

        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 3000);
    }

    // Запуск
    init();

    // ====== WEBSOCKET ДЛЯ LIVE-ОБНОВЛЕНИЙ ======
    function connectWS() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${location.host}/ws`);

        ws.onmessage = async (event) => {
            const msg = event.data;
            // При изменении рейтинга или направления — перечитываем данные
            if (msg === 'update_rating' || msg === 'sport_direction_changed') {
                await loadData();
                // Восстанавливаем выбранную фазу
                if (state.currentPhaseId) {
                    const phase = state.phases.find(p => p.id === state.currentPhaseId);
                    if (phase) {
                        state.currentDirection = phase.sport_direction || 'more';
                        updateDirectionUI();
                    }
                }
                showToast('Данные обновлены');
            }
        };

        ws.onclose = () => setTimeout(connectWS, 3000);
        ws.onerror = (err) => console.error('WS error:', err);
    }
    connectWS();

    // Автообновление каждые 30 секунд (fallback)
    setInterval(loadData, 30000);
</script>
{% endblock %}
