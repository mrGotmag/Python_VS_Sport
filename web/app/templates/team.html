{% extends "base.html" %}
{% block title %}Кабинет // Python vs Спорт{% endblock %}
{% block head %}
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/dracula.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
{% endblock %}

{% block content %}
<div class="w-full max-w-7xl flex gap-6 fade-in mx-auto">
    <!-- ЛЕВАЯ ПАНЕЛЬ (Фиксированная) -->
    <aside class="w-72 shrink-0 hidden md:flex flex-col border border-line bg-panel rounded-xl overflow-hidden sticky top-20 h-[calc(100vh-7rem)]">
        <div class="p-4 border-b border-line bg-ink shrink-0">
            <div class="text-[10px] text-neon tracking-[0.3em]">// TASKS_LIST</div>
            <h2 class="font-display font-bold text-lg mt-1" id="team-name">Загрузка...</h2>
        </div>
        <div class="flex-1 overflow-y-auto p-2 space-y-2" id="tasks-list">
            <div class="text-xs text-slate-500 p-2 text-center">Загрузка задач...</div>
        </div>
        <div class="p-4 border-t border-line text-center shrink-0">
            <a href="/logout" class="block text-xs text-magenta hover:text-white transition">[ ВЫЙТИ ]</a>
        </div>
    </aside>

    <!-- ПРАВАЯ ПАНЕЛЬ (Скроллится целиком) -->
    <section class="flex-1 flex flex-col min-w-0 border border-line bg-panel rounded-xl relative">
        <div id="status-banner" class="hidden p-3 text-center border-b border-line bg-ink text-sm font-bold tracking-widest rounded-t-xl"></div>

        <div id="workspace-empty" class="p-12 flex flex-col items-center justify-center text-slate-600 text-sm min-h-[400px]">
            <div class="text-4xl mb-4">👈</div>
            &gt; выберите задачу из списка слева _
        </div>

        <div id="workspace" class="hidden flex-col h-full relative">
            <div id="workspace-overlay" class="hidden absolute inset-0 bg-[#0a0e14]/90 z-50 flex flex-col items-center justify-center backdrop-blur-sm">
                <div id="ws-overlay-icon" class="text-4xl font-bold mb-2 animate-pulse">⏸</div>
                <h2 id="ws-overlay-title" class="text-2xl font-bold mb-2"></h2>
            </div>

            <!-- Условие (Без скролла, растягивается) -->
            <div class="p-6 border-b border-line bg-ink">
                <h2 id="task-title" class="font-display text-xl font-bold text-neon"></h2>
                <div id="task-statement" class="text-sm text-slate-300 mt-3 prose prose-invert max-w-none"></div>
            </div>

            <!-- Редактор кода (Фиксированной высоты, чтобы было удобно писать) -->
            <div class="h-[400px] border-b border-line relative bg-[#0a0e14]">
                <textarea id="code-editor"></textarea>
            </div>

            <!-- Панель управления -->
            <div class="bg-ink flex flex-col rounded-b-xl">
                <div id="checker-output" class="hidden border-b border-line p-4 text-sm font-mono whitespace-pre-wrap bg-[#05080c] text-slate-300"></div>
                <div class="p-4 flex items-center justify-between">
                    <div id="submit-status" class="text-sm font-mono"></div>
                    <button id="btn-submit" class="bg-neon text-ink font-bold text-sm tracking-widest px-6 py-2.5 rounded hover:bg-white transition shadow-neon">ОТПРАВИТЬ РЕШЕНИЕ &gt;&gt;</button>
                </div>
            </div>
        </div>
    </section>
</div>

<script>
    let editor;
    let currentTaskId = null;
    let globalPaused = false;
    let globalStarted = false;
    let teamPaused = false;
    let teamFinished = false;

    function formatTime(s) {
        if (s < 0) s = 0;
        const h = Math.floor(s/3600).toString().padStart(2,'0');
        const m = Math.floor((s%3600)/60).toString().padStart(2,'0');
        const sec = (s%60).toString().padStart(2,'0');
        return `${h}:${m}:${sec}`;
    }

    function renderTasks(tasks) {
        const list = document.getElementById('tasks-list');
        if (!tasks || !tasks.length) {
            list.innerHTML = '<div class="text-xs text-slate-500 p-2 text-center">Задач нет.</div>';
            return;
        }

        list.innerHTML = tasks.map(t => {
            const disabled = (!globalStarted || globalPaused || teamPaused || teamFinished);
            const clickAction = disabled ? '' : `onclick="openTask(${t.id})"`;
            const classes = disabled ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer hover:border-neon';
            const activeClass = (currentTaskId === t.id) ? 'border-neon bg-neon/5' : 'border-line';

            return `
            <div ${clickAction} class="p-3 border ${activeClass} rounded ${classes} transition group">
                <div class="flex justify-between items-center text-[10px]">
                    <span class="text-slate-500 group-hover:text-neon">ЗАДАЧА #${t.order_index}</span>
                    <span class="text-warn font-mono font-bold">${t.current_score} / ${t.max_points} B</span>
                </div>
                <div class="text-sm font-bold mt-1">${t.title}</div>
                ${t.time_spent > 0 ? `<div class="text-[10px] text-cyan mt-1">Решено за: ${formatTime(t.time_spent)}</div>` : ''}
            </div>`;
        }).join('');
    }

    async function init() {
        try {
            const res = await fetch('/api/team/me');
            if (res.status === 401) return window.location.href = '/';
            const data = await res.json();

            document.getElementById('team-name').textContent = data.team.name;

            globalStarted = data.global.is_started;
            globalPaused = data.global.is_paused;
            teamPaused = data.team.is_paused;
            teamFinished = data.team.finished_at !== null;

            renderTasks(data.tasks);

            // Индикатор ONLINE/OFFLINE
            const netIndicator = document.getElementById('net-status');
            const isLocked = (!globalStarted || globalPaused || teamPaused || teamFinished);

            if (netIndicator) {
                if (isLocked) {
                    netIndicator.className = "flex items-center gap-1.5 text-magenta";
                    netIndicator.innerHTML = '<span class="w-2 h-2 rounded-full bg-magenta"></span><span class="text-[10px] tracking-widest">OFFLINE</span>';
                } else {
                    netIndicator.className = "flex items-center gap-1.5 text-neon";
                    netIndicator.innerHTML = '<span class="w-2 h-2 rounded-full bg-neon animate-pulse"></span><span class="text-[10px] tracking-widest">ONLINE</span>';
                }
            }

            // Баннер
            const banner = document.getElementById('status-banner');
            const timerBox = document.getElementById('global-timer');
            const timerText = document.getElementById('timer-text');

            banner.classList.remove('hidden');
            timerBox.classList.remove('hidden');

            if (teamFinished) {
                banner.textContent = "ЗАВЕРШЕНО";
                banner.className = "p-3 text-center border-b border-magenta bg-magenta/10 text-magenta font-bold tracking-widest";
                timerText.textContent = "FINISHED";
                timerBox.className = "flex items-center gap-2 border border-magenta px-3 py-1.5 rounded text-magenta font-mono font-bold";
            } else if (!globalStarted) {
                banner.textContent = "ОЖИДАНИЕ СТАРТА";
                banner.className = "p-3 text-center border-b border-cyan bg-cyan/10 text-cyan font-bold tracking-widest";
                timerText.textContent = "WAITING";
                timerBox.className = "flex items-center gap-2 border border-cyan px-3 py-1.5 rounded text-cyan font-mono font-bold";
            } else if (globalPaused || teamPaused) {
                banner.textContent = "НА ПАУЗЕ";
                banner.className = "p-3 text-center border-b border-warn bg-warn/10 text-warn font-bold tracking-widest";
                timerText.textContent = "PAUSED";
                timerBox.className = "flex items-center gap-2 border border-warn px-3 py-1.5 rounded text-warn font-mono font-bold";
            } else {
                banner.textContent = "ИДЕТ СОРЕВНОВАНИЕ";
                banner.className = "p-3 text-center border-b border-neon bg-neon/10 text-neon font-bold tracking-widest";
                timerText.textContent = formatTime(data.contest.remaining_seconds);
                timerBox.className = "flex items-center gap-2 border border-neon/30 bg-neon/10 px-3 py-1.5 rounded text-neon font-mono font-bold glow-text";
            }

            // Оверлей в задаче
            const wsOverlay = document.getElementById('workspace-overlay');
            if (isLocked) {
                wsOverlay.classList.remove('hidden');
                document.getElementById('ws-overlay-icon').textContent = teamFinished ? '🏁' : (!globalStarted ? '⏳' : '⏸');
                document.getElementById('ws-overlay-title').textContent = teamFinished ? 'ЗАВЕРШЕНО' : (!globalStarted ? 'ОЖИДАНИЕ' : 'ПАУЗА');
            } else {
                wsOverlay.classList.add('hidden');
            }

            // Кнопка отправки
            const btn = document.getElementById('btn-submit');
            if (btn) {
                if (isLocked) {
                    btn.disabled = true;
                    btn.textContent = "НЕДОСТУПНО";
                } else {
                    btn.disabled = false;
                    btn.textContent = "ОТПРАВИТЬ РЕШЕНИЕ >>";
                }
            }

        } catch (e) { console.error("Ошибка:", e); }
    }

    async function openTask(id) {
        if (!globalStarted || globalPaused || teamPaused || teamFinished) return;
        currentTaskId = id;
        document.getElementById('workspace-empty').classList.add('hidden');
        document.getElementById('workspace').classList.remove('hidden');
        document.getElementById('workspace').classList.add('flex');

        // Перерисовываем список, чтобы подсветить активную задачу
        init();

        const res = await fetch(`/api/team/tasks/${id}`);
        const task = await res.json();
        document.getElementById('task-title').textContent = task.title;
        document.getElementById('task-statement').innerHTML = marked.parse(task.statement);

        if (!editor) {
            editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), {
                mode: 'python', theme: 'dracula', lineNumbers: true, indentUnit: 4, matchBrackets: true, autofocus: true
            });
        }
        editor.setValue(localStorage.getItem(`draft_${document.getElementById('team-name').textContent}_${id}`) || '');

        // Прокручиваем страницу к началу задачи при выборе
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function submitCode() {
        if (!currentTaskId || !globalStarted || globalPaused || teamPaused || teamFinished) return;
        const btn = document.getElementById('btn-submit');
        const status = document.getElementById('submit-status');
        const outputBox = document.getElementById('checker-output');

        btn.disabled = true; status.textContent = 'Проверка...'; status.className = 'text-cyan text-sm font-mono animate-pulse'; outputBox.classList.add('hidden');

        const code = editor.getValue();
        localStorage.setItem(`draft_${document.getElementById('team-name').textContent}_${currentTaskId}`, code);

        try {
            const res = await fetch('/api/team/submissions', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ task_id: currentTaskId, code: code })
            });
            const data = await res.json();
            if (res.ok) {
                status.textContent = '✔ ГОТОВО'; status.className = 'text-neon text-sm font-mono glow-text';
                if (data.checker_result) { outputBox.textContent = data.checker_result; outputBox.classList.remove('hidden'); }
                init();
            } else {
                status.textContent = '✘ ' + (data.detail || 'Ошибка'); status.className = 'text-magenta text-sm font-mono';
            }
        } catch (e) {
            status.textContent = '✘ Сеть'; status.className = 'text-magenta text-sm font-mono';
        } finally {
            if(globalStarted && !globalPaused && !teamPaused && !teamFinished) btn.disabled = false;
        }
    }

    document.getElementById('btn-submit').addEventListener('click', submitCode);
    setInterval(() => { if (editor && currentTaskId) localStorage.setItem(`draft_${document.getElementById('team-name').textContent}_${currentTaskId}`, editor.getValue()); }, 3000);

    const ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onmessage = (e) => { if (e.data === 'timer_changed' || e.data === 'tasks_changed' || e.data === 'update_rating') init(); };

    init();
    setInterval(init, 10000);
</script>
{% endblock %}
