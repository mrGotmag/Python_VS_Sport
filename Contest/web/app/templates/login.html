{% extends "base.html" %}

{% block title %}Вход в систему // Python vs Спорт{% endblock %}

{% block content %}
<div class="w-full max-w-md fade-in">
    <div class="border border-line bg-panel rounded-xl shadow-2xl overflow-hidden">
        
        <div class="bg-ink border-b border-line p-6 text-center">
            <div class="text-[10px] text-neon tracking-[0.4em] mb-2">// AUTH_REQUIRED</div>
            <h2 class="font-display text-2xl font-bold">ВХОД В СИСТЕМУ</h2>
        </div>

        <div class="p-8">
            <div id="login-error" class="hidden border border-magenta bg-magenta/5 rounded-lg p-3 mb-5 text-sm text-magenta"></div>

            <form hx-post="/api/login" hx-target="#form-area" hx-swap="innerHTML" id="login-form" class="space-y-5">
                <div id="form-area">
                    <div>
                        <label class="block text-[10px] text-slate-500 tracking-[0.2em] mb-1.5">// НАЗВАНИЕ КОМАНДЫ</label>
                        <input type="text" name="team_name" required placeholder="Бобры-Программисты"
                               class="w-full bg-ink border border-line rounded-md px-3 py-2.5 text-sm text-slate-200 placeholder:text-slate-600 focus:border-neon focus:ring-1 focus:ring-neon outline-none transition font-mono">
                    </div>
                    
                    <div class="mt-4">
                        <label class="block text-[10px] text-slate-500 tracking-[0.2em] mb-1.5">// ПАРОЛЬ ОРГАНИЗАЦИИ</label>
                        <input type="password" name="password" required placeholder="••••••••"
                               class="w-full bg-ink border border-line rounded-md px-3 py-2.5 text-sm text-slate-200 placeholder:text-slate-600 focus:border-neon focus:ring-1 focus:ring-neon outline-none transition font-mono">
                    </div>

                    <button type="submit"
                            class="mt-6 w-full bg-neon text-ink font-bold text-sm tracking-widest py-3 rounded-md hover:bg-white transition shadow-neon">
                        ВОЙТИ &gt;&gt;
                    </button>
                </div>
            </form>
            
            <div class="mt-6 text-center text-xs text-slate-500">
                Нет команды? <a href="/" class="text-cyan hover:text-neon transition">Зарегистрироваться</a>
            </div>
        </div>
    </div>
</div>

<script>
    document.body.addEventListener('htmx:beforeRequest', function(evt) {
        if (evt.detail.elt.id === 'login-form') {
            document.getElementById('login-error').classList.add('hidden');
        }
    });

    document.body.addEventListener('htmx:afterRequest', function(evt) {
        if (evt.detail.elt.id !== 'login-form') return;

        if (evt.detail.xhr.status === 200) {
            // Успех! Токен уже установлен в cookie сервером.
            // Просто перекидываем пользователя в кабинет.
            window.location.href = '/team';
        } else {
            try {
                const data = JSON.parse(evt.detail.xhr.responseText);
                const errDiv = document.getElementById('login-error');
                errDiv.textContent = data.detail || 'Ошибка входа';
                errDiv.classList.remove('hidden');
            } catch {}
        }
    });
</script>
{% endblock %}
