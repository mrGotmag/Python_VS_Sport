{% extends "base.html" %}
{% block content %}
<div class="w-full max-w-md fade-in">
    <div class="border border-line bg-panel rounded-xl shadow-2xl p-8 text-center">
        <div class="text-[10px] text-neon tracking-[0.4em] mb-2">// AUTH_REQUIRED</div>
        <h2 class="font-display text-2xl font-bold mb-6">ВХОД В СИСТЕМУ</h2>
        <form id="login-form" class="space-y-4">
            <div>
                <input type="password" name="password" id="login-pwd" required placeholder="Введите пароль" class="w-full bg-ink border border-line rounded px-3 py-3 text-center text-xl tracking-widest text-neon focus:border-neon outline-none">
            </div>
            <button type="submit" class="w-full bg-neon text-ink font-bold py-3 rounded text-lg hover:bg-white transition shadow-neon">ВОЙТИ</button>
        </form>
        <div id="err" class="text-magenta text-sm mt-4 hidden"></div>

        <!-- Ссылка на регистрацию -->
        <div class="mt-8 pt-4 border-t border-line text-xs text-slate-500">
            Нет аккаунта?
            <a href="/register" class="text-cyan hover:text-neon transition">Зарегистрировать команду</a>
        </div>
    </div>
</div>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pwd = document.getElementById('login-pwd').value;
    const res = await fetch('/api/login', { method: 'POST', body: new URLSearchParams({password: pwd}) });
    if (res.ok) {
        const data = await res.json();
        window.location.href = data.role === 'admin' ? '/admin' : '/team';
    } else { const d = await res.json(); const er = document.getElementById('err'); er.textContent = d.detail; er.classList.remove('hidden'); }
});
</script>
{% endblock %}
