{% extends "base.html" %}
{% block content %}
<div class="w-full max-w-md fade-in">
    <div class="border border-neon bg-panel rounded-xl shadow-2xl p-8 text-center">
        <h2 class="text-2xl font-bold text-neon mb-4">ПЕРВИЧНАЯ НАСТРОЙКА</h2>
        <p class="text-slate-400 text-sm mb-6">Создайте пароль администратора для управления системой.</p>
        <form id="setup-form" class="space-y-4 text-left">
            <div>
                <label class="block text-[10px] text-slate-500 tracking-[0.2em] mb-1">// ПАРОЛЬ АДМИНА</label>
                <input type="password" name="password" id="setup-pwd" required class="w-full bg-ink border border-line rounded px-3 py-2 text-white focus:border-neon outline-none">
            </div>
            <button type="submit" class="w-full bg-neon text-ink font-bold py-3 rounded mt-2">СОЗДАТЬ</button>
        </form>
        <div id="err" class="text-magenta text-sm mt-3 hidden"></div>
    </div>
</div>
<script>
document.getElementById('setup-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pwd = document.getElementById('setup-pwd').value;
    const res = await fetch('/api/setup', { method: 'POST', body: new URLSearchParams({password: pwd}) });
    if (res.ok) window.location.href = '/';
    else { const d = await res.json(); const er = document.getElementById('err'); er.textContent = d.detail; er.classList.remove('hidden'); }
});
</script>
{% endblock %}
